<div class="login"><h1>Thumbs Up Friday</h1><div class="panel"><p class="mu" style="margin-top:0">Sign in with a GitHub token. It stays in this browser only and is sent only to GitHub.</p>

const c=cfg();o.value=c.owner;r.value=c.repo;e.textContent=new URLSearchParams(location.search).get('e')||'';

 try{await load('content.json');location.href='../admin/'}catch(x){LS.removeItem('tuftok');e.textContent=x.message;go.disabled=false}};
