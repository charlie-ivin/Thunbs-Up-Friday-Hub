<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thumbs Up Friday</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f4f6;--card:#fff;--ink:#1b2a3a;--mut:#64748b;--line:#dbe2e8;--acc:#1f3a5f;--acc2:#f2c14e;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#10171f;--card:#18222d;--ink:#e8eef4;--mut:#93a4b5;--line:#2a3846;--acc:#f2c14e;--acc2:#f2c14e;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0;font-weight:800;flex:1}nav{display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:8px 12px;border-radius:8px;cursor:pointer}
nav button.on{background:var(--acc);color:var(--bg)}@media(prefers-color-scheme:dark){nav button.on{color:#10171f}}
main{max-width:980px;margin:0 auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
button,select,input{font:inherit;color:var(--ink)}input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}@media(prefers-color-scheme:dark){.btn{color:#10171f}}
.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.danger{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.grow{flex:1}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--line)}.muted{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.file{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.file .th{height:170px;background:#fff;display:flex;align-items:flex-start;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
.file canvas{width:100%;height:auto}.file .t{padding:8px 10px;font-size:13px;font-weight:600;word-break:break-word}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;margin:2px;font-size:13px}
.chip b{cursor:pointer;color:var(--bad)}#me{position:relative}#menu{position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;width:230px;box-shadow:0 8px 24px #0003}
.prof{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;font-weight:600}
.auth{max-width:340px;margin:12vh auto;padding:0 20px}.auth input{width:100%;margin-bottom:10px}.err{color:var(--bad);min-height:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:9}
.alert{display:block;width:100%;border:0;border-radius:14px;padding:22px;font:800 22px 'Bricolage Grotesque',sans-serif;cursor:pointer;margin-bottom:16px;background:#f2c14e;color:#1b2a3a}
.alert small{display:block;font-weight:600;font-size:14px}.alert.late{background:#b3261e;color:#fff}
.flash{animation:fl 1s ease-in-out infinite}@keyframes fl{50%{opacity:.45}}
@media(prefers-reduced-motion:reduce){.flash{animation:none;outline:4px solid currentColor}}
.pj{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0b1118;color:#fff;text-align:center;padding:20px}
#pc{font-size:min(18vw,200px);font-weight:800;line-height:1}#pd{font-size:min(4vw,36px);color:#93a4b5;margin-bottom:30px}
#ps{font-size:min(7vw,72px);font-weight:800;padding:18px 48px;border-radius:24px}#pn{font-size:min(3.5vw,30px);color:#cbd5e1}
#ps.ok{background:#1e7b45}#ps.due{background:#f2c14e;color:#1b2a3a}#ps.late{background:#b3261e}#ps.idle{background:#1f2c3a}
#ps.due,#ps.late{animation:fl 1.2s ease-in-out infinite}
</style></head><body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const db=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY),$=s=>document.querySelector(s),app=$('#app');
const ROLES=['baker','digital_lead','manager','owner'],LBL={baker:'Baker',digital_lead:'Digital Lead',manager:'Manager',owner:'Owner'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ld=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
let me,pages={},cfg={avatar_change:true},tab='dashboard',day=ld(new Date());
const isAdmin=()=>['manager','owner'].includes(me.role),canEdit=()=>['digital_lead','manager','owner'].includes(me.role);
const can=p=>p==='dashboard'?true:p==='admin'?isAdmin():me.role==='owner'||pages[p]?.roles.includes(me.role)||pages[p]?.users.includes(me.id);
const fn=async b=>{const r=await db.functions.invoke('members',{body:b});if(r.error){let m=r.error.message;try{m=(await r.error.context.json()).error||m}catch{}throw new Error(m)}return r.data};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2500)};
const dflt=n=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#1f3a5f"/><text x="20" y="27" font-size="20" font-family="sans-serif" fill="#f2c14e" text-anchor="middle">${esc((n||'?')[0].toUpperCase())}</text></svg>`);
const pic=p=>p.avatar_url||dflt(p.name);

function authView(signup=false,msg=''){
 app.innerHTML=`<div class="auth"><h1 style="margin-bottom:16px">Thumbs Up Friday</h1>
 ${signup?'<input id="n" placeholder="Your name">':''}<input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password (6+ characters)">${signup?'<input id="c" type="password" placeholder="Administrator password">':''}
 <div class="err">${esc(msg)}</div><button class="btn" id="go" style="width:100%">${signup?'Create account':'Log in'}</button>${signup?'':'<button class="btn ghost" id="gg" style="width:100%;margin-top:8px">Continue with Google</button>'}
 <p class="muted" style="text-align:center"><a href="#" id="sw">${signup?'Have an account? Log in':'New here? Create an account'}</a></p></div>`;
 $('#sw').onclick=e=>{e.preventDefault();authView(!signup)};
 $('#go').onclick=async()=>{const email=$('#e').value.trim(),password=$('#p').value;
  if(signup)try{await fn({action:'signup',name:$('#n').value.trim(),email,password,code:$('#c').value})}catch(x){return authView(true,x.message)}
  const r=await db.auth.signInWithPassword({email,password});if(r.error)authView(signup,r.error.message)};
 if($('#gg'))$('#gg').onclick=()=>db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
}
function pwView(msg=''){app.innerHTML=`<div class="auth"><h1 style="margin-bottom:8px">Choose a new password</h1><p class="muted">Your account was set up with a temporary password. Pick your own to continue.</p><input id="a" type="password" placeholder="New password (6+ characters)"><input id="b" type="password" placeholder="Repeat it"><div class="err">${esc(msg)}</div><button class="btn" id="go" style="width:100%">Save password</button></div>`;
 $('#go').onclick=async()=>{const a=$('#a').value;if(a.length<6||a!==$('#b').value)return pwView('Passwords must match and be 6+ characters.');
  const r=await db.auth.updateUser({password:a});if(r.error)return pwView(r.error.message);await db.from('profiles').update({must_change:false}).eq('id',me.id);me.must_change=false;shell()}}

async function boot(){
 const{data:{session}}=await db.auth.getSession();if(!session)return authView();
 const[p,pg,s]=await Promise.all([db.from('profiles').select('*').eq('id',session.user.id).single(),db.from('pages').select('*'),db.from('settings').select('*').limit(1).single()]);
 if(p.error)return authView(false,'Profile not found. Did you run setup.sql?');
 me=p.data;pages=Object.fromEntries(pg.data.map(x=>[x.key,x]));cfg=s.data||cfg;if(me.must_change)return pwView();if(location.hash==='#projector'&&isAdmin())return projector();shell();
}
function shell(){
 const tabs=[['dashboard','Dashboard'],['attendance','Attendance'],['library','Library'],['admin','Admin']].filter(t=>can(t[0]));
 if(!tabs.find(t=>t[0]===tab))tab=tabs[0]?.[0];
 app.innerHTML=`<header><h1>Thumbs Up Friday</h1><nav>${tabs.map(t=>`<button class="${t[0]===tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</nav>
 <div id="me"><button class="prof" id="pb"><img class="av" src="${esc(pic(me))}" alt=""><span>${esc(me.name)}</span></button><div id="menu" hidden></div></div></header><main id="main"></main>`;
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;shell()});
 $('#pb').onclick=menu;({dashboard,attendance,library,admin}[tab]||(()=>$('#main').innerHTML='<div class="card">You don\'t have access to any pages yet. Ask an admin.</div>'))();
}
function menu(){const m=$('#menu');if(!m.hidden){m.hidden=true;return}
 const ok=cfg.avatar_change||isAdmin();
 m.innerHTML=`<div style="font-weight:600">${esc(me.name)}</div><div class="muted" style="margin-bottom:10px">${LBL[me.role]}</div>
 ${ok?`<label class="btn ghost" style="display:block;text-align:center;cursor:pointer">Change photo<input id="pf" type="file" accept="image/*" hidden></label>`:`<div class="muted">Changing your photo is turned off. Contact your administrator for this action.</div>`}
 <button class="btn ghost" id="lo" style="width:100%;margin-top:8px">Log out</button>`;m.hidden=false;
 $('#lo').onclick=async()=>{await db.auth.signOut();authView()};
 if(ok)$('#pf').onchange=async e=>{const f=e.target.files[0];if(!f)return;const path=`${me.id}/${Date.now()}`;
  const u=await db.storage.from('avatars').upload(path,f);if(u.error)return toast('Not allowed: contact your administrator');
  const url=db.storage.from('avatars').getPublicUrl(path).data.publicUrl;await db.from('profiles').update({avatar_url:url}).eq('id',me.id);me.avatar_url=url;shell()};
}

async function dashboard(){
 const now=new Date(),today=ld(now),fri=now.getDay()===5,mins=d=>d.getHours()*60+d.getMinutes(),DUE=8*60+30;
 let h=`<div class="card"><h2>Hi ${esc(me.name)}</h2><p class="muted" style="margin:0">${fri?"It's Thumbs Up Friday!":"See you next Friday."}</p></div>`;
 const{data:sd}=await db.rpc('attendance_stats'),my=sd?.find(x=>x.ref===me.id);
 if(my&&my.total)h+=`<div class="card">Your attendance: <b>${Math.round(100*my.attended/my.total)}%</b> <span class="muted">(${my.attended} of ${my.total} sessions)</span></div>`;
 if(isAdmin()){
  const{data:s}=await db.from('submissions').select('*').eq('day',today).maybeSingle();
  if(s){const t=new Date(s.submitted_at),lt=mins(t)>DUE;h+=`<div class="card">Attendance submitted by <b>${esc(s.submitted_by)}</b> at ${t.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}${lt?' (late)':''}.</div>`}
  else if(fri)h+=mins(now)>=DUE?`<button class="alert late flash" id="ta">Attendance late<small>It was due by 8:30 AM. Take attendance now.</small></button>`:`<button class="alert flash" id="ta">Take attendance<small>Due by 8:30 AM</small></button>`;
 }
 if(isAdmin())h+='<a class="btn ghost" href="#projector" target="_blank" style="display:inline-block;text-decoration:none">Open projector view</a>';
 $('#main').innerHTML=h;if($('#ta'))$('#ta').onclick=()=>{day=today;tab='attendance';shell()};
}

async function projector(){
 document.title='Thumbs Up Friday - Projector';
 app.innerHTML='<div class="pj"><div id="pc"></div><div id="pd"></div><div id="ps"></div><div id="pn"></div></div>';
 const fmt=t=>t.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});let st={s:null,n:0};
 const load=async()=>{const t=ld(new Date()),[a,b]=await Promise.all([db.from('submissions').select('*').eq('day',t).maybeSingle(),db.from('attendance').select('ref').eq('day',t).eq('present',true)]);st={s:a.data,n:b.data?.length||0}};
 const draw=()=>{const now=new Date(),m=now.getHours()*60+now.getMinutes()+now.getSeconds()/60,due=new Date(now);due.setHours(8,30,0,0);
  $('#pc').textContent=now.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',second:'2-digit'});
  $('#pd').textContent=now.toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'});
  let c='idle',t='No club today',n='';
  if(st.s){const x=new Date(st.s.submitted_at);c='ok';t='Register complete';n=`Submitted by ${st.s.submitted_by} at ${fmt(x)} \u00b7 ${st.n} present`}
  else if(now.getDay()===5){if(now>=due){c='late';t='Register overdue';n='Due by 8:30 AM'}else{c='due';t='Register due by 8:30 AM';const left=Math.ceil((due-now)/6e4);n=left>=60?`${Math.floor(left/60)}h ${left%60}m left`:`${left} min left`}}
  $('#ps').className=c;$('#ps').textContent=t;$('#pn').textContent=n};
 await load();draw();setInterval(draw,1000);setInterval(load,15000);
}

async function attendance(){
 const[b,g,a,sb]=await Promise.all([db.from('profiles').select('id,name,avatar_url').eq('role','baker').order('name'),db.from('guests').select('*').order('name'),db.from('attendance').select('ref,present').eq('day',day),db.from('submissions').select('day').eq('day',day).maybeSingle()]);
 const here=Object.fromEntries(a.data.map(x=>[x.ref,x.present])),people=[...b.data.map(x=>({...x,ref:x.id,g:0})),...g.data.map(x=>({...x,ref:x.id,g:1}))];
 $('#main').innerHTML=`<div class="card"><div class="row" style="border:0"><h2 class="grow" style="margin:0">Take attendance</h2><input type="date" id="d" value="${day}"></div>
 <p class="muted">Bakers appear automatically. Add anyone else below.</p>
 ${people.map(p=>`<label class="row"><input type="checkbox" data-r="${p.ref}" ${here[p.ref]?'checked':''}><img class="av" src="${esc(pic(p))}" alt=""><span class="grow">${esc(p.name)} ${p.g?'<span class="muted">(added manually)</span>':''}</span>${p.g?`<button class="ghost btn danger" data-x="${p.id}">Remove</button>`:''}</label>`).join('')||'<p class="muted">No bakers yet.</p>'}
 <p><b>${Object.values(here).filter(Boolean).length}</b> present</p>
 <button class="btn" id="sub">${sb.data?'Update submission':'Submit attendance'}</button>
 <div class="row"><input id="gn" class="grow" placeholder="Add a person manually"><button class="btn" id="ga">Add</button></div></div>`;
 $('#d').onchange=e=>{day=e.target.value;attendance()};
 document.querySelectorAll('[data-r]').forEach(c=>c.onchange=async()=>{await db.from('attendance').upsert({day,ref:c.dataset.r,present:c.checked});attendance()});
 document.querySelectorAll('[data-x]').forEach(x=>x.onclick=async e=>{e.preventDefault();await db.from('guests').delete().eq('id',x.dataset.x);attendance()});
 $('#sub').onclick=async()=>{await db.from('submissions').upsert({day,submitted_by:me.name,submitted_at:new Date().toISOString()},{ignoreDuplicates:true});toast('Attendance submitted');attendance()};
 $('#ga').onclick=async()=>{const n=$('#gn').value.trim();if(n){await db.from('guests').insert({name:n});attendance()}};
}

async function library(){
 const{data:fs}=await db.from('files').select('*').order('created_at',{ascending:false});
 $('#main').innerHTML=`<div class="card"><div class="row" style="border:0"><h2 class="grow" style="margin:0">Recipes & signage</h2><input id="q" placeholder="Search"></div>
 ${canEdit()?`<label class="btn" style="display:inline-block;cursor:pointer">Upload PDFs<input id="up" type="file" accept="application/pdf" multiple hidden></label> <span class="muted" id="us"></span>`:''}</div><div class="grid" id="g"></div>`;
 const urls={};if(fs.length){const s=await db.storage.from('docs').createSignedUrls(fs.map(f=>f.path),3600);s.data?.forEach(x=>urls[x.path]=x.signedUrl)}
 const draw=()=>{const q=$('#q').value.toLowerCase();$('#g').innerHTML=fs.filter(f=>f.title.toLowerCase().includes(q)).map(f=>`<div class="file" data-u="${esc(urls[f.path]||'')}" data-id="${f.id}" data-p="${esc(f.path)}"><div class="th"></div><div class="t">${esc(f.title)}${canEdit()?` <a href="#" class="danger muted" data-del="1">delete</a>`:''}</div></div>`).join('')||'<p class="muted">No files yet.</p>';
  const io=new IntersectionObserver(es=>es.forEach(async e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const u=e.target.dataset.u;if(!u)return;
   try{const pdf=await pdfjsLib.getDocument(u).promise,pg=await pdf.getPage(1),v=pg.getViewport({scale:.5}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;
   await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;e.target.querySelector('.th').append(c)}catch{e.target.querySelector('.th').textContent='PDF'}}),{rootMargin:'200px'});
  document.querySelectorAll('.file').forEach(f=>{io.observe(f);f.onclick=async e=>{if(e.target.dataset.del){e.preventDefault();e.stopPropagation();if(!confirm('Delete this file?'))return;
    await db.storage.from('docs').remove([f.dataset.p]);await db.from('files').delete().eq('id',f.dataset.id);return library()}
   window.open(f.dataset.u,'_blank')}})};
 $('#q').oninput=draw;draw();
 if(canEdit())$('#up').onchange=async e=>{const l=[...e.target.files];let n=0;for(const f of l){$('#us').textContent=`Uploading ${++n} of ${l.length}...`;
  const path=crypto.randomUUID()+'.pdf',u=await db.storage.from('docs').upload(path,f,{contentType:'application/pdf'});
  if(u.error){toast('Upload failed: '+u.error.message);continue}await db.from('files').insert({title:f.name.replace(/\.pdf$/i,''),path})}library()};
}

async function admin(){
 const{data:ps}=await db.from('profiles').select('*').order('name');
 const st=Object.fromEntries(((await db.rpc('attendance_stats')).data||[]).map(x=>[x.ref,x])),pct=x=>x&&x.total?`${Math.round(100*x.attended/x.total)}% attendance (${x.attended}/${x.total})`:'No sessions yet';
 $('#main').innerHTML=`<div class="card"><h2>Add a member</h2><p class="muted">They get a temporary password and must choose their own the first time they log in.</p>
 <div class="row" style="flex-wrap:wrap;border:0"><input id="mn" placeholder="Name"><input id="mem" type="email" placeholder="Email"><select id="mr">${ROLES.filter(r=>r!=='owner'||me.role==='owner').map(r=>`<option value="${r}">${LBL[r]}</option>`).join('')}</select><button class="btn" id="am">Create account</button></div></div>
 <div class="card"><h2>Members</h2>${ps.map(p=>`<div class="row"><img class="av" src="${esc(pic(p))}" alt=""><span class="grow">${esc(p.name)}<br><span class="muted">${pct(st[p.id])}</span></span><button class="btn ghost" data-rs="${p.id}">Reset password</button>
 <select data-role="${p.id}">${ROLES.map(r=>`<option value="${r}" ${r===p.role?'selected':''}>${LBL[r]}</option>`).join('')}</select></div>`).join('')}</div>
 <div class="card"><h2>Page access</h2><p class="muted">Owners always have access. Tick the roles that get a page by default, then add specific people on top.</p>
 ${['attendance','library'].map(k=>`<h3>${k==='attendance'?'Attendance':'Library'}</h3>${ROLES.map(r=>`<label style="margin-right:12px"><input type="checkbox" data-pr="${k}:${r}" ${pages[k].roles.includes(r)?'checked':''}> ${LBL[r]}</label>`).join('')}
 <div style="margin:8px 0">${pages[k].users.map(u=>`<span class="chip">${esc(ps.find(p=>p.id===u)?.name||'?')}<b data-ru="${k}:${u}">×</b></span>`).join('')}
 <select data-au="${k}"><option value="">Add a person...</option>${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>`).join('')}</div>
 <div class="card"><h2>Settings</h2><label><input type="checkbox" id="av" ${cfg.avatar_change?'checked':''}> Let members change their profile photo</label></div>`;
 $('#am').onclick=async()=>{const name=$('#mn').value.trim(),email=$('#mem').value.trim();if(!name||!email)return toast('Enter a name and email');
  try{const r=await fn({action:'create',name,email,role:$('#mr').value});prompt(`${name} logs in with ${email} and this temporary password (shown once). They will be asked to change it.`,r.password);admin()}catch(x){toast(x.message)}};
 document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{if(!confirm('Reset this password? They will get a new temporary one.'))return;try{const r=await fn({action:'reset',id:b.dataset.rs});prompt('New temporary password (shown once):',r.password)}catch(x){toast(x.message)}});
 document.querySelectorAll('[data-role]').forEach(s=>s.onchange=async()=>{const r=await db.rpc('set_role',{uid:s.dataset.role,r:s.value});if(r.error){toast(r.error.message);admin()}else toast('Role updated')});
 const save=async k=>{const r=await db.from('pages').update({roles:pages[k].roles,users:pages[k].users}).eq('key',k);r.error?toast(r.error.message):toast('Saved');admin()};
 document.querySelectorAll('[data-pr]').forEach(c=>c.onchange=()=>{const[k,r]=c.dataset.pr.split(':');pages[k].roles=c.checked?[...new Set([...pages[k].roles,r])]:pages[k].roles.filter(x=>x!==r);save(k)});
 document.querySelectorAll('[data-ru]').forEach(c=>c.onclick=()=>{const[k,u]=c.dataset.ru.split(':');pages[k].users=pages[k].users.filter(x=>x!==u);save(k)});
 document.querySelectorAll('[data-au]').forEach(s=>s.onchange=()=>{if(!s.value)return;const k=s.dataset.au;pages[k].users=[...new Set([...pages[k].users,s.value])];save(k)});
 $('#av').onchange=async e=>{cfg.avatar_change=e.target.checked;const r=await db.from('settings').update({avatar_change:cfg.avatar_change}).eq('id',1);toast(r.error?r.error.message:'Saved')};
}
db.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'&&!me)boot();if(ev==='SIGNED_OUT'){me=null}});boot();
</script></body></html>
